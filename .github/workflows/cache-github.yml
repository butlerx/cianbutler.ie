name: Rebuild Github data
on:
  push:
    branches:
      - main
    # Deploy-key pushes retrigger workflows; skip our own data commits
    paths-ignore:
      - data/github.json
  schedule:
    - cron: '0 4 * * *'
jobs:
  githubData:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] v7.0.1
        with:
          # Deploy key is a bypass actor on the default-branch ruleset
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - run: npm install
      - name: Install git-emoji
        run: |-
          wget https://raw.githubusercontent.com/butlerx/git-emoji/master/hooks/commit-msg -O .git/hooks/commit-msg
          chmod +x .git/hooks/commit-msg
      - name: Build data/github.json
        run: mise run github-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Format data
        run: mise run format
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: Rebuild data/github.json
